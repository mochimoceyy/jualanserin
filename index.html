function cardHTML(a){return '<a class="card" href="#app-'+a.id+'"><div class="em">'+a.e+'</div><h3>'+a.n+'</h3><span class="tag">'+a.c+'</span><p style="margin:8px 0">'+a.d+'</p><span class="price">mulai '+rp(minP(a))+'</span></a>'}
function filtered(){var q=query.trim().toLowerCase();return APPS.filter(function(a){return (cat==="Semua"||a.c===cat)&&(!q||(a.n+" "+a.c+" "+a.d).toLowerCase().indexOf(q)>-1)})}
function head(t,s){return '<div class="sec"><h2>'+t+'</h2><p>'+s+'</p></div>'}

function home(){
var stars=[["8%","14%"],["88%","18%"],["14%","78%"],["92%","72%"],["50%","6%"]].map(function(p,i){return '<span class="st" style="left:'+p[0]+';top:'+p[1]+';font-size:'+(1+i*.25)+'rem">★</span>'}).join("");
return '<section class="hero">'+stars+greetHTML()+'<div class="cta"><a class="btn" href="#produk">Lihat Daftar Harga</a><a class="btn alt" target="_blank" rel="noopener" href="'+CHANNEL+'">🥰 Testimoni</a><a class="btn alt" href="#kontak">💌 Kontak</a></div></section>'
+head("Daftar Harga 💰","Silahkan kakak, no rush order yap!")
+'<div class="grid">'+APPS.map(cardHTML).join("")+'</div>'
+head("Tanya-tanya yang sering muncul","")
+'<div class="card"><p><b>Aman nggak?</b><br>Aman! Ada garansi dan admin siap bantu.</p><p><b>Bayarnya pakai apa?</b><br>Transfer bank, e-wallet, atau QRIS. Detailnya dikasih admin.</p><p><b>Kalau akun bermasalah?</b><br>Langsung chat admin, kami bantu sampai beres.</p></div>'
+head("Cara belinya gampang banget","Tiga langkah, selesai!")
+'<div class="steps card"><div>Pilih aplikasi & paket yang kamu mau di daftar harga.</div><div>Chat admin lewat WhatsApp, kirim nama aplikasinya.</div><div>Bayar, tunggu sebentar, akun siap dipakai. Happy nonton! 🍿</div></div>'}

var GREET=[
[4,"Selamat pagi","☀️",["Semoga harimu secerah senyummu hari ini! Serin udah siap bantu dari pagi, jadi santai aja ya 🤎","Pagi-pagi udah mampir, makasih banyak ya! Yuk mulai hari dengan hiburan premium tanpa ribet ✨"]],
[11,"Selamat siang","🌤️",["Jangan lupa makan siang dan minum air putih ya! Sambil istirahat, Serin temenin pilih aplikasi favoritmu 🍱","Siang-siang gini enaknya rebahan sambil nonton. Serin siap bantu kamu kapan pun 🤎"]],
[15,"Selamat sore","🌇",["Semoga capekmu hari ini terbayar ya. Pelan-pelan aja pilihnya, Serin dengan senang hati bantu kamu 🤎","Sore yang hangat buat kamu yang udah berjuang seharian! Yuk, manjakan dirimu sedikit 🍵"]],
[18,"Selamat malam","🌙",["Terima kasih sudah mampir di penghujung harimu. Istirahat yang cukup ya, biar Serin yang urus hiburanmu 🤎","Malam-malam gini paling pas maraton film. Tanya apa aja, Serin balas dengan senang hati ✨"]]];
function greetNow(){var d=new Date(),h=d.getHours(),g=GREET[3];for(var k=0;k<4;k++)if(h>=GREET[k][0]&&(k===3||h<GREET[k+1][0]))g=GREET[k];if(h<4)g=GREET[3];return {d:d,g:g}}
function clockText(d){var z=-d.getTimezoneOffset()/60,tz={7:"WIB",8:"WITA",9:"WIT"}[z]||"";return [d.getHours(),d.getMinutes(),d.getSeconds()].map(function(n){return String(n).padStart(2,"0")}).join(".")+(tz?" "+tz:"")}
function greetHTML(){var n=greetNow(),m=n.g[3][n.d.getDate()%n.g[3].length];return '<div class="greet" id="greet"><h2>'+n.g[1]+', kak! '+n.g[2]+'</h2><div class="clock" id="clock">'+clockText(n.d)+'</div><p>'+m+'</p><p class="note" style="margin-top:8px">'+n.d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+'</p></div>'}
var greetKey="";
function tick(){var c=$("#clock");if(!c)return;var n=greetNow();if(greetKey&&greetKey!==n.g[1]){$("#greet").outerHTML=greetHTML()}else c.textContent=clockText(n.d);greetKey=n.g[1]}
setInterval(tick,1000);

function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function testi(t){return '<div class="card"><div style="color:var(--tan)">★★★★★</div><p style="margin:8px 0;white-space:pre-line">“'+esc(t.message)+'”</p><b>— '+esc(t.name)+'</b>'+(t.createdAt?'<p class="note">'+new Date(t.createdAt).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})+'</p>':'')+'</div>'}

function produk(){
var cats=["Semua"].concat(APPS.map(function(a){return a.c}).filter(function(c,i,s){return s.indexOf(c)===i}));
var list=filtered();
return head("Daftar Harga 💰","Pilih aplikasi favoritmu, klik buat lihat penjelasan & semua paketnya.")
+'<div class="chips">'+cats.map(function(c){return '<button class="chip'+(c===cat?' on':'')+'" data-c="'+c+'">'+c+'</button>'}).join("")+'</div>'
+(list.length?'<div class="grid">'+list.map(cardHTML).join("")+'</div>':'<div class="empty"><div class="em">🔍</div><p>Yah, “'+query.replace(/</g,"&lt;")+'” belum ada nih. Coba kata lain, atau <a href="'+wa("Halo Serin, aku cari aplikasi: "+query)+'" target="_blank" rel="noopener"><b>tanya admin</b></a> siapa tahu bisa dicarikan!</p></div>')}

function infoHTML(a){return '<div class="info"><h3>⚠️ Info wajib dibaca</h3><ul>'+a.i.map(function(t){return '<li>'+t+'</li>'}).join("")+'</ul></div>'}
function explain(a){return '<h3 style="margin-top:18px">Penjelasan aplikasi</h3>'+a.x.map(function(x){return '<h3 class="xp">'+x[0]+'</h3><ul class="xl">'+x[1].map(function(t){return '<li>'+t+'</li>'}).join("")+'</ul>'}).join("")}
function label(a,g,p){return a.n+(g?" "+g:"")+" "+p[0]}
function detail(id){
var a=APPS.find(function(x){return x.id===id});if(!a)return produk();
var g="",rows=a.p.map(function(p,k){if(typeof p==="string"){g=p;return '<tr><td colspan="3" class="grp">'+p+'</td></tr>'}
var btn=a.i?'<button class="btn buy" style="padding:6px 14px" data-a="'+a.id+'" data-k="'+k+'">Beli</button>':'<a class="btn" style="padding:6px 14px" target="_blank" rel="noopener" href="'+wa("Halo Serin, aku mau beli "+label(a,g,p)+" ("+rp(p[1])+")")+'">Beli</a>';
return '<tr><td>'+p[0]+'</td><td class="price">'+rp(p[1])+'</td><td>'+btn+'</td></tr>'}).join("");
return '<a class="back" href="#produk">← Balik ke daftar</a><div class="two"><div class="card"><div class="em" style="font-size:3rem">'+a.e+'</div><h1 style="font-size:2rem">'+a.n+'</h1><span class="tag">'+a.c+'</span>'+(a.x?explain(a):'<h3 style="margin-top:18px">Apa sih ini?</h3><p>'+a.l+'</p><h3>Yang kamu dapat</h3><p>✅ Akun premium siap pakai<br>✅ Panduan login dari admin<br>✅ Garansi sesuai durasi paket<br>✅ Bantuan kalau ada kendala</p>')+'</div><div class="card"><h3>Pilih paketmu</h3>'+(a.i?infoHTML(a):'')+'<table>'+rows+'</table><p style="color:var(--mute);font-size:.88rem">Harga bisa berubah, konfirmasi stok ke admin dulu ya 🤎</p></div></div>'}

function openInfo(a,k){
var g="";for(var j=0;j<=k;j++)if(typeof a.p[j]==="string")g=a.p[j];
var p=a.p[k],m=$("#modal");
m.innerHTML='<div class="box card" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">'+label(a,g,p)+' · <span class="price">'+rp(p[1])+'</span></h3>'+infoHTML(a)
+'<label class="agree"><input type="checkbox" id="ok"> Saya sudah membaca dan menyetujui info di atas</label>'
+'<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn alt" id="mx">Batal</button><a class="btn off" id="go" target="_blank" rel="noopener" aria-disabled="true" href="'+wa("Halo Serin, aku mau beli "+label(a,g,p)+" ("+rp(p[1])+"). Aku sudah membaca dan menyetujui infonya.")+'">💬 Lanjut ke WhatsApp</a></div></div>';
m.hidden=false}
function closeInfo(){var m=$("#modal");m.hidden=true;m.innerHTML=""}

var TESTI=null;
function loadTesti(){fetch("/api/testimonials").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){TESTI=d;showTesti()}).catch(function(){TESTI=TESTI||[];showTesti("Gagal memuat testimoni, coba muat ulang halaman ya.")})}
function showTesti(err){var l=$("#tl");if(!l)return;l.innerHTML=err?'<div class="empty"><p>'+err+'</p></div>':TESTI.length?'<div class="grid">'+TESTI.map(testi).join("")+'</div>':'<div class="empty"><div class="em">💭</div><p>Belum ada testimoni di sini. Jadilah yang pertama berbagi cerita, ya!</p></div>'}
function testimoni(){return head("Testimoni 🥰","Bukti nyata dari pelanggan Serin")
+'<div class="card" style="text-align:center"><div class="em">📢</div><h3>Saluran WhatsApp Testimoni</h3><p>Semua bukti transaksi & testimoni asli pelanggan Serin dikumpulkan di saluran WhatsApp.</p><a class="btn" target="_blank" rel="noopener" href="'+CHANNEL+'">Lihat Testimoni</a></div>'
+head("Kata Mereka 💬","Udah beli? Yuk ceritain pengalaman kamu di sini!")
+'<div class="two"><div id="tl"><div class="empty"><p>Memuat testimoni…</p></div></div>'
+'<form class="card form" id="tf"><h3>Tulis testimonimu ✍️</h3><label for="tn">Nama</label><input id="tn" name="name" maxlength="60" required placeholder="Nama kamu (boleh nama panggilan)"><label for="tm">Testimoni</label><textarea id="tm" name="message" maxlength="500" required placeholder="Tulis pengalamanmu setelah beli…"></textarea><button class="btn" type="submit">Kirim Testimoni</button><p class="note" id="ts" role="status"></p></form></div>'}

function kontak(){return head("Hubungi Admin 💌","Jangan malu-malu, kami senang banget disapa!")
+'<div class="grid"><div class="card"><div class="em">💬</div><h3>WhatsApp</h3><p>Paling cepat dibalas.</p><a class="btn" target="_blank" rel="noopener" href="'+wa("Halo Serin, aku mau tanya produk")+'">Chat sekarang</a></div><div class="card"><div class="em">𝕏</div><h3>X (Twitter)</h3><p>@'+X+'<br>Ikuti buat info promo terbaru.</p><a class="btn" target="_blank" rel="noopener" href="https://x.com/'+X+'">Kunjungi X</a></div><div class="card"><div class="em">🕗</div><h3>Jam Layanan</h3><p>'+JAM+'</p></div></div>'}

function render(){
var h=(location.hash||"#home").slice(1),v;
if(h.indexOf("app-")===0)v=detail(h.slice(4));else if(h==="produk")v=produk();else if(h==="testimoni")v=testimoni();else if(h==="kontak")v=kontak();else v=home();
$("#app").innerHTML=v;greetKey="";
if(h==="testimoni"){if(TESTI)showTesti();loadTesti()}
var cur=h.indexOf("app-")===0?"produk":h;
$("#nav").innerHTML=[["home","Beranda"],["produk","Harga"],["testimoni","Testimoni"],["kontak","Kontak"]].map(function(x){return '<a href="#'+x[0]+'"'+(x[0]===cur?' class="on"':'')+'>'+x[1]+'</a>'}).join("");
document.title="Jualan Serin ✦ Aplikasi Premium Murah & Aman";
window.scrollTo(0,0)}

$("#app").addEventListener("click",function(e){var u=e.target.closest(".buy");if(u){openInfo(APPS.find(function(x){return x.id===u.dataset.a}),+u.dataset.k);return}var b=e.target.closest(".chip");if(b){cat=b.dataset.c;var y=window.scrollY;render();window.scrollTo(0,y)}});
$("#app").addEventListener("submit",function(e){if(e.target.id!=="tf")return;e.preventDefault();var f=e.target,b=f.querySelector("button"),st=$("#ts"),name=f.elements.name.value.trim(),msg=f.elements.message.value.trim();
if(!name||!msg){st.textContent="Nama dan testimoni wajib diisi ya 🤎";return}
b.disabled=true;b.classList.add("off");st.textContent="Mengirim…";
fetch("/api/testimonials",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name,message:msg})}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||"Gagal");return d})})
.then(function(d){TESTI=[d].concat(TESTI||[]);showTesti();f.reset();st.textContent="Makasih banyak, testimonimu sudah tampil! 🥰"})
.catch(function(err){st.textContent=(err&&err.message&&err.message!=="Gagal"?err.message:"Gagal mengirim, coba lagi sebentar ya.")})
.finally(function(){b.disabled=false;b.classList.remove("off")})});
$("#q").addEventListener("input",function(e){query=e.target.value;if(location.hash!=="#produk"){location.hash="#produk"}else{var y=window.scrollY;render();window.scrollTo(0,y)}});
$("#modal").addEventListener("change",function(e){if(e.target.id==="ok"){var g=$("#go");g.classList.toggle("off",!e.target.checked);g.setAttribute("aria-disabled",!e.target.checked)}});
$("#modal").addEventListener("click",function(e){if(e.target.id==="mx"||e.target.id==="modal"){closeInfo();return}if(e.target.closest("#go")){if(!$("#ok").checked){e.preventDefault();$(".agree").classList.add("need")}else closeInfo()}});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeInfo()});
window.addEventListener("hashchange",function(){closeInfo();render()});
render();
</script>
</body>
</html>
